services:
  # 1. Python FastAPI Backend Service
  - type: web
    name: route-score-optimizer-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m backend.main"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0

  # 2. React Vite Frontend Static Site
  - type: web
    name: route-score-optimizer-ui
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: route-score-optimizer-api
          property: host
